name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: 24.16.0
  NPM_VERSION: 11.13.0
  PI_VERSION: 0.83.0

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install PTY verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends expect tmux

      - name: Verify toolchain and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = "$BUN_VERSION"
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
          bun install --frozen-lockfile --ignore-scripts
          bun pm untrusted

      - name: Build certified Pi host
        shell: bash
        run: |
          set -euo pipefail
          bun run host:build
          test "$(.artifacts/pi-host/linux-x64/pi --version)" = "$PI_VERSION"
          env -u CI -u GITHUB_ACTIONS \
            PI_BIN="$GITHUB_WORKSPACE/.artifacts/pi-host/linux-x64/pi" \
            PI_HOST_ATTESTATION="$GITHUB_WORKSPACE/.artifacts/pi-host-attestation.json" \
            PI_HOST_SOURCE_CHECKOUT="$GITHUB_WORKSPACE/.artifacts/pi-source" \
            bun -e 'import { verifyPiHostProvenance } from "./scripts/verify-pi-host-provenance.ts"; await verifyPiHostProvenance(process.env.PI_BIN);'

      - name: Run disconnected verification
        shell: bash
        env:
          PI_BIN: ${{ github.workspace }}/.artifacts/pi-host/linux-x64/pi
          PI_HOST_ATTESTATION: ${{ github.workspace }}/.artifacts/pi-host-attestation.json
        run: |
          set -euo pipefail
          sudo --preserve-env=HOME,PATH,PI_BIN,PI_HOST_ATTESTATION,CI,GITHUB_ACTIONS,GITHUB_WORKSPACE unshare --net -- \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
            bash -euo pipefail -c '
              if curl --silent --max-time 2 https://example.com >/dev/null 2>&1; then
                echo "network namespace is not isolated" >&2
                exit 1
              fi
              bun run check
            '
