name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  PI_ARCHIVE_SHA256: b0625eb623197b0afe20c870d21ef2f34481f1504e5777df3f698a66c7636f5f
  PI_VERSION: 0.83.0

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify toolchain and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = "$BUN_VERSION"
          bun install --frozen-lockfile --ignore-scripts
          bun pm untrusted

      - name: Download certified Pi host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          archive=.artifacts/pi-linux-x64.tar.gz
          url="https://github.com/earendil-works/pi/releases/download/v${PI_VERSION}/pi-linux-x64.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 "$url" --output "$archive"
          echo "$PI_ARCHIVE_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C .artifacts
          test "$(.artifacts/pi/pi --version)" = "$PI_VERSION"

      - name: Run disconnected verification
        shell: bash
        env:
          PI_BIN: ${{ github.workspace }}/.artifacts/pi/pi
        run: |
          set -euo pipefail
          sudo --preserve-env=HOME,PATH,PI_BIN unshare --net -- \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
            bash -euo pipefail -c '
              if curl --silent --max-time 2 https://example.com >/dev/null 2>&1; then
                echo "network namespace is not isolated" >&2
                exit 1
              fi
              bun run check
            '
