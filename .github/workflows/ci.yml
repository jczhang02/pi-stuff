name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      probe_kernel_events:
        description: Verify scheduler-event access on a separate ephemeral runner
        type: boolean
        default: false
      scheduler_baseline:
        description: Optional full commit SHA for paired scheduler measurements when probing
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.0
  PI_RELEASE_ARCHIVE_SHA256: a7e7c65f1dc528d2e17e7d946ad2b61df0e2b0f9952faee77807c2484b464d6e
  RTK_ARCHIVE_SHA256: c4c036fbf181fc55ef329786c8c17e0d427972b053b825944d968a6aafef1ba4
  RTK_BINARY_SHA256: 99e0cff729d52297a23eb832f809d9773ba7c32de818dfe76b2cdd900a951535
  RTK_VERSION: 0.45.0

jobs:
  kernel-events:
    name: Kernel event probe
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_kernel_events }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify isolated scheduler-event capture
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin bash -euo pipefail -s -- "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" <<'PROBE'
          [[ "$1" =~ ^[0-9]+-[0-9]+$ ]]
          trace_root=/sys/kernel/tracing
          instance=
          mounted=false
          cleanup() {
            if [[ -n "$instance" ]]; then
              printf '0\n' > "$instance/tracing_on"
              rmdir -- "$instance"
            fi
            if "$mounted"; then umount "$trace_root"; fi
          }
          trap cleanup EXIT
          if ! mountpoint -q "$trace_root"; then
            mount -t tracefs tracefs "$trace_root"
            mounted=true
          fi
          requested_instance="$trace_root/instances/pi-stuff-probe-$1"
          mkdir -- "$requested_instance"
          instance="$requested_instance"
          printf '0\n' > "$instance/tracing_on"
          printf '1024\n' > "$instance/buffer_size_kb"
          for event in sched_wakeup sched_wakeup_new sched_process_fork sched_process_exit; do
            test -r "$instance/events/sched/$event/format"
            printf '1\n' > "$instance/events/sched/$event/enable"
          done
          printf '1\n' > "$instance/tracing_on"
          sleep 0.1 &
          probe_pid=$!
          wait "$probe_pid"
          printf '0\n' > "$instance/tracing_on"
          awk 'FNR == 1 { if (NR > 1 && counters != 3) invalid = 1; counters = 0 }
               /^(overrun|commit overrun|dropped events):/ { counters++; if ($NF != 0) invalid = 1 }
               END { exit (invalid || counters != 3) }' "$instance"/per_cpu/cpu*/stats
          uname -r
          awk -v pid="$probe_pid" '
            / sched_wakeup: / && $0 ~ " pid=" pid " " { wakeups++ }
            / sched_wakeup_new: / && $0 ~ " pid=" pid " " { new_wakeups++ }
            / sched_process_fork: / && $0 ~ " child_pid=" pid "($| )" { forks++ }
            / sched_process_exit: / && $0 ~ " pid=" pid " " { exits++ }
            END {
              printf "{\"scope\":\"sleep-positive-control\",\"wakeups\":%d,\"newWakeups\":%d,\"forks\":%d,\"exits\":%d,\"lostEvents\":0}\n", wakeups, new_wakeups, forks, exits
              exit !(wakeups > 0 && new_wakeups == 1 && forks == 1 && exits == 1)
            }' "$instance/trace"
          PROBE

  fast:
    name: Fast
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      acceptance_required: ${{ steps.scope.outputs.acceptance_required }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Classify acceptance scope
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun run ci:acceptance-scope

      - name: Verify Bun and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = "$BUN_VERSION"
          bun install --frozen-lockfile --ignore-scripts
          bun pm untrusted

      - name: Verify acceptance classifier
        run: bun test test/ci-acceptance-scope.test.ts

      - name: Run fast checks
        run: bun run check:fast

  acceptance:
    name: Acceptance
    needs: fast
    if: ${{ github.event_name != 'push' && needs.fast.outputs.acceptance_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.probe_kernel_events && 55 || 30 }}
    env:
      PI_BIN: ${{ github.workspace }}/.artifacts/pi-release/pi/pi
      PI_STUFF_CODE_MODE_HOST: ${{ github.workspace }}/.artifacts/code-mode-host/codex-code-mode-host
      RTK_BIN: ${{ github.workspace }}/.artifacts/rtk/bin/rtk
      SYSTEM_TOOL_BIN: ${{ github.workspace }}/.artifacts/system-tools/bin

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = "$BUN_VERSION"
          bun install --frozen-lockfile --ignore-scripts
          bun pm untrusted

      - name: Install PTY verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends expect fd-find iproute2 ripgrep tmux
          mkdir -p "$SYSTEM_TOOL_BIN"
          ln --symbolic "$(command -v fdfind)" "$SYSTEM_TOOL_BIN/fd"
          test -x "$SYSTEM_TOOL_BIN/fd"
          command -v rg >/dev/null

      - name: Allow observer namespaces on the ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          install --mode=0755 /usr/bin/unshare "$SYSTEM_TOOL_BIN/unshare"
          sudo apparmor_parser --replace <<PROFILE
          abi <abi/4.0>,
          profile pi-stuff-ci-unshare "$SYSTEM_TOOL_BIN/unshare" flags=(unconfined) {
            userns,
          }
          PROFILE

      - name: Install certified RTK runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/rtk/bin
          archive=".artifacts/rtk/rtk-${RTK_VERSION}-linux-x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rtk-ai/rtk/releases/download/v${RTK_VERSION}/rtk-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          echo "$RTK_ARCHIVE_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory .artifacts/rtk/bin rtk
          echo "$RTK_BINARY_SHA256  $RTK_BIN" | sha256sum --check --strict
          test "$("$RTK_BIN" --version)" = "rtk $RTK_VERSION"

      - name: Install certified Pi host release
        shell: bash
        run: |
          set -euo pipefail
          version="$(bun scripts/pi-host-contract.ts)"
          mkdir -p .artifacts/pi-release
          archive=".artifacts/pi-release/pi-linux-x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/earendil-works/pi/releases/download/v${version}/pi-linux-x64.tar.gz" \
            --output "$archive"
          echo "$PI_RELEASE_ARCHIVE_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory .artifacts/pi-release
          test "$("$PI_BIN" --version)" = "$(bun scripts/pi-host-contract.ts)"
          bun -e 'import { verifyPiHostProvenance } from "./scripts/verify-pi-host-provenance.ts"; await verifyPiHostProvenance(process.env.PI_BIN);'

      - name: Install certified Code Mode host
        shell: bash
        run: |
          set -euo pipefail
          bun -e '
            import { installCodeModeHost } from "./packages/pi-stuff/src/code-mode/host/install-host.ts";
            const destination = process.env.PI_STUFF_CODE_MODE_HOST;
            if (!destination) throw new Error("PI_STUFF_CODE_MODE_HOST is required");
            await installCodeModeHost({ arch: process.arch, destination, platform: process.platform });
          '
          test -x "$PI_STUFF_CODE_MODE_HOST"

      - name: Measure isolated Pi scheduler wakeups
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_kernel_events }}
        shell: bash
        env:
          SCHEDULER_BASELINE: ${{ inputs.scheduler_baseline }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pi-stuff-scheduler"
          measure() {
            sudo env -i PATH="$SYSTEM_TOOL_BIN:$(dirname "$RTK_BIN"):$PATH" \
              GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
              PI_BIN="$PI_BIN" PI_STUFF_CODE_MODE_HOST="$PI_STUFF_CODE_MODE_HOST" \
              "$(command -v bun)" scripts/benchmark-scheduler-wakeups.ts \
              --uid "$(id -u)" --gid "$(id -g)" --package "$2" \
              --output "$RUNNER_TEMP/pi-stuff-scheduler/$1.json"
          }
          candidate="$PWD/packages/pi-stuff"
          if [[ -n "$SCHEDULER_BASELINE" ]]; then
            [[ "$SCHEDULER_BASELINE" =~ ^[a-f0-9]{40}$ ]]
            baseline="$PWD/.worktrees/scheduler-baseline"
            git worktree add --detach "$baseline" "$SCHEDULER_BASELINE"
            (cd "$baseline" && bun install --frozen-lockfile --ignore-scripts)
            measure baseline-1 "$baseline/packages/pi-stuff"
            measure candidate-1 "$candidate"
            measure candidate-2 "$candidate"
            measure baseline-2 "$baseline/packages/pi-stuff"
          else
            measure candidate "$candidate"
          fi

      - name: Upload scheduler summary
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.probe_kernel_events }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scheduler-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pi-stuff-scheduler/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Run disconnected acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pi-stuff-ci"
          rtk_directory="$(dirname "$RTK_BIN")"
          export PATH="$SYSTEM_TOOL_BIN:$rtk_directory:$PATH"
          export PI_STUFF_AGENTS_PTY_ARTIFACT_DIR="$RUNNER_TEMP/pi-stuff-ci/agents"
          export PI_STUFF_UI_PTY_ARTIFACT_DIR="$RUNNER_TEMP/pi-stuff-ci/ui"
          sudo --preserve-env=HOME,PATH,PI_BIN,PI_STUFF_AGENTS_PTY_ARTIFACT_DIR,PI_STUFF_CODE_MODE_HOST,PI_STUFF_UI_PTY_ARTIFACT_DIR,RTK_BIN,RUNNER_TEMP,CI,GITHUB_ACTIONS,GITHUB_WORKSPACE unshare --net -- \
            bash -euo pipefail -c '
              ip link set lo up
              exec setpriv --reuid="$1" --regid="$2" --clear-groups \
                bash -euo pipefail -c "$3"
            ' _ "$(id -u)" "$(id -g)" '
              if curl --silent --max-time 2 https://example.com >/dev/null 2>&1; then
                echo "network namespace is not isolated" >&2
                exit 1
              fi
              if ! unshare --user --map-root-user --net --pid --fork --kill-child --mount-proc true; then
                echo "Suite observer namespace preflight failed" >&2
                sudo dmesg | rg "apparmor=|userns" | tail -n 20 || true
                exit 1
              fi
              bun run test:ci
              bun run benchmark:tool-activity
              bun run pack:verify
            ' 2>&1 | tee "$RUNNER_TEMP/pi-stuff-ci/acceptance.log"

      - name: Upload failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pi-stuff-ci
          if-no-files-found: warn
          retention-days: 7
