name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Install repository-check dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements.txt
      - name: Test the repository checker
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check repository files
        run: python scripts/check_repo.py
      - name: Check PR evidence
        run: python scripts/check_pr.py
