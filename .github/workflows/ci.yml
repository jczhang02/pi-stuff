name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: 24.16.0
  NPM_VERSION: 11.13.0
  PI_VERSION: 0.83.0
  RTK_ARCHIVE_SHA256: 34975116da11e09e502501daf758143e0b22ed3a42a10eb67fb693a6270d9e36
  RTK_BINARY_SHA256: 1d8bf5f1861f5ce33236400b1d93b967aec30b6a456e9a0b43b1584c5200119a
  RTK_VERSION: 0.42.4

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install PTY verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends expect iproute2 tmux

      - name: Verify toolchain and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = "$BUN_VERSION"
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
          bun install --frozen-lockfile --ignore-scripts
          bun pm untrusted

      - name: Install certified RTK runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/rtk/bin
          archive=".artifacts/rtk/rtk-${RTK_VERSION}-linux-x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rtk-ai/rtk/releases/download/v${RTK_VERSION}/rtk-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          echo "$RTK_ARCHIVE_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory .artifacts/rtk/bin rtk
          echo "$RTK_BINARY_SHA256  .artifacts/rtk/bin/rtk" | sha256sum --check --strict
          test "$(.artifacts/rtk/bin/rtk --version)" = "rtk $RTK_VERSION"

      - name: Build certified Pi host
        shell: bash
        run: |
          set -euo pipefail
          bun run host:build
          test "$(.artifacts/pi-host/linux-x64/pi --version)" = "$PI_VERSION"
          env -u CI -u GITHUB_ACTIONS \
            PI_BIN="$GITHUB_WORKSPACE/.artifacts/pi-host/linux-x64/pi" \
            PI_HOST_ATTESTATION="$GITHUB_WORKSPACE/.artifacts/pi-host-attestation.json" \
            PI_HOST_SOURCE_CHECKOUT="$GITHUB_WORKSPACE/.artifacts/pi-source" \
            bun -e 'import { verifyPiHostProvenance } from "./scripts/verify-pi-host-provenance.ts"; await verifyPiHostProvenance(process.env.PI_BIN);'

      - name: Run disconnected verification
        shell: bash
        env:
          PI_BIN: ${{ github.workspace }}/.artifacts/pi-host/linux-x64/pi
          PI_HOST_ATTESTATION: ${{ github.workspace }}/.artifacts/pi-host-attestation.json
        run: |
          set -euo pipefail
          export RTK_BIN="$GITHUB_WORKSPACE/.artifacts/rtk/bin/rtk"
          export PATH="$GITHUB_WORKSPACE/.artifacts/rtk/bin:$PATH"
          sudo --preserve-env=HOME,PATH,PI_BIN,PI_HOST_ATTESTATION,RTK_BIN,CI,GITHUB_ACTIONS,GITHUB_WORKSPACE unshare --net -- \
            bash -euo pipefail -c '
              ip link set lo up
              exec setpriv --reuid="$1" --regid="$2" --clear-groups \
                bash -euo pipefail -c "$3"
            ' _ "$(id -u)" "$(id -g)" '
              if curl --silent --max-time 2 https://example.com >/dev/null 2>&1; then
                echo "network namespace is not isolated" >&2
                exit 1
              fi
              bun run check
            '
