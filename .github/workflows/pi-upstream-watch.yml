name: Pi Upstream Watch

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-upstream-watch
  cancel-in-progress: true

jobs:
  latest:
    name: Latest Pi
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Compare certified and latest Pi
        shell: bash
        run: |
          set -euo pipefail
          certified="$(bun scripts/pi-host-contract.ts)"
          latest="$(npm view @earendil-works/pi-coding-agent version)"
          echo "Certified Pi: $certified"
          echo "Latest Pi:    $latest"
          if test "$certified" != "$latest"; then
            echo "::error::Certified Pi $certified is behind the latest release $latest. Run the audited Host upgrade workflow."
            exit 1
          fi
